<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="רמת ביטוי משתנה: אותו גנוטיפ, חומרה שונה">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >רמת ביטוי משתנה: אותו גנוטיפ, חומרה שונה</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >הבדל בעוצמת הפנוטיפ ≠ הבדל בגנוטיפ</text>
 <g class="scene" style="--delay:0.0s"><rect x="60" y="125" width="290" height="190" rx="14" fill="#e7f4ff" stroke="#c8d9e6" stroke-width="2" /><text x="205.0" y="167" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >הורים</text><text x="205.0" y="208" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >BB × bb</text><text x="205.0" y="243" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >כל הצאצאים: Bb</text></g><g class="scene" style="--delay:0.8s"><text x="408" y="215" font-size="42" fill="#4497bc" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >→</text><text x="742" y="140" font-size="24" fill="#164769" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >לכולם גנוטיפ Bb</text><circle cx="490" cy="232" r="43" fill="#d8e6ff" stroke="#42678f" stroke-width="2"/><text x="490" y="297" font-size="21" fill="#214b72" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >Bb</text><circle cx="635" cy="232" r="43" fill="#8fb2ef" stroke="#42678f" stroke-width="2"/><text x="635" y="297" font-size="21" fill="#214b72" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >Bb</text><circle cx="780" cy="232" r="43" fill="#4e78bb" stroke="#42678f" stroke-width="2"/><text x="780" y="297" font-size="21" fill="#214b72" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >Bb</text><circle cx="925" cy="232" r="43" fill="#17488d" stroke="#42678f" stroke-width="2"/><text x="925" y="297" font-size="21" fill="#214b72" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >Bb</text><text x="743" y="337" font-size="20" fill="#2e5e7e" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >חומרת התסמינים משתנה — למרות גנוטיפ זהה</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אל תסיקי מהצביעה הכהה יותר שיש לצאצא אלל נוסף.</text>
 </svg>