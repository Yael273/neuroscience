<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="בכבשים: הפנוטיפ תלוי במין, לא רק בגנוטיפ">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בכבשים: הפנוטיפ תלוי במין, לא רק בגנוטיפ</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אותו H₁H₂ מתבטא אחרת בזכר ובנקבה</text>
 <g class="scene" style="--delay:0.0s"><rect x="55" y="122" width="280" height="208" rx="14" fill="#eff9f5" stroke="#c8d9e6" stroke-width="2" /><text x="195.0" y="164" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אותו גנוטיפ: H₁H₂</text><text x="195.0" y="205" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >זכר: בעל קרניים</text><text x="195.0" y="240" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >נקבה: חסרת קרניים</text></g><g class="scene" style="--delay:0.8s"><rect x="398" y="122" width="292" height="208" rx="14" fill="#e8f4fc" stroke="#c8d9e6" stroke-width="2" /><text x="544" y="167" font-size="26" fill="#1d6697" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >F₁</text><text x="544" y="215" font-size="26" fill="#254862" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >Aa H₁H₂</text><text x="544" y="265" font-size="21" fill="#254862" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >כולם לבנים</text></g><g class="scene" style="--delay:1.6s"><rect x="752" y="122" width="290" height="208" rx="14" fill="#fff3e6" stroke="#c8d9e6" stroke-width="2" /><text x="897" y="165" font-size="22" fill="#a15b1d" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >F₂: לבן + קרניים</text><text x="897" y="215" font-size="24" fill="#254862" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >זכרים: 9/16</text><text x="897" y="264" font-size="24" fill="#254862" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >נקבות: 3/16</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בתוך כל מין: בהכלאת F₁ × F₁ היחס לקרניים מתהפך בין זכרים לנקבות.</text>
 </svg>