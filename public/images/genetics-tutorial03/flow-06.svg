<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="השרקנים: ההכלאה זהה, הטמפרטורה משנה את הצבע">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >השרקנים: ההכלאה זהה, הטמפרטורה משנה את הצבע</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >הגן B לאורך הזנב אינו משתנה עם הטמפרטורה בדוגמה</text>
 <g class="scene" style="--delay:0.0s"><rect x="54" y="122" width="312" height="225" rx="14" fill="#f8f3ec" stroke="#c8d9e6" stroke-width="2" /><text x="210" y="165" font-size="24" fill="#7a4c21" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >AaBb × AaBb</text><text x="210" y="218" font-size="20" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >צבע: ¾ A_ , ¼ aa</text><text x="210" y="273" font-size="20" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >זנב: ¾ ארוך , ¼ קצר</text></g><g class="scene" style="--delay:0.8s"><rect x="402" y="122" width="293" height="225" rx="14" fill="#f0f8ff" stroke="#c8d9e6" stroke-width="2" /><text x="547" y="165" font-size="25" fill="#1b679a" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >18°C</text><text x="547" y="220" font-size="23" fill="#825330" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >¾ חומים</text><text x="547" y="265" font-size="22" fill="#3a6585" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >¼ לבנים</text></g><g class="scene" style="--delay:1.6s"><rect x="729" y="122" width="293" height="225" rx="14" fill="#f0f8ff" stroke="#c8d9e6" stroke-width="2" /><text x="874" y="165" font-size="25" fill="#1b679a" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >25°C</text><text x="874" y="220" font-size="23" fill="#825330" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >כולם חומים</text><text x="874" y="265" font-size="22" fill="#3a6585" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >0 לבנים</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >ב־18°C יחס צבע 3:1; ב־25°C גם aa חומים ולכן 100% חומים.</text>
 </svg>