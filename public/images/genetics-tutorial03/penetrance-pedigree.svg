<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="350" viewBox="0 0 980 350"><title>המחשה לימודית לגנטיקה</title><style>text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .h{fill:#1d4b77;font-weight:700;font-size:25px} .label{fill:#26486b;font-size:18px} .small{fill:#52677c;font-size:15px} .pulse{animation:pulse 8s ease-in-out infinite} @keyframes pulse{0%,15%,100%{opacity:.45}20%,35%{opacity:1}} @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="22" fill="#f7fbff"/><text class="h" x="490" y="49" text-anchor="middle">חדירות חלקית: נשא אינו חייב להיות חולה</text><rect x="30.0" y="78" width="294.7" height="206" rx="16" fill="#e9f4ff" stroke="#b7d3e7"/><text x="177.3" y="112" text-anchor="middle" font-weight="bold" font-size="21" fill="#1d507a">אב Aa</text><text x="177.3" y="151" text-anchor="middle" font-size="18" fill="#31526b">נשא של A</text><text x="177.3" y="181" text-anchor="middle" font-size="18" fill="#31526b">יכול להיות ללא תסמינים</text><rect x="342.6666666666667" y="78" width="294.7" height="206" rx="16" fill="#e9f7ef" stroke="#b7d3e7"/><text x="490.0" y="112" text-anchor="middle" font-weight="bold" font-size="21" fill="#1d507a">אם aa</text><text x="490.0" y="151" text-anchor="middle" font-size="18" fill="#31526b">לא נושאת A</text><text x="490.0" y="181" text-anchor="middle" font-size="18" fill="#31526b">אינה חולה</text><rect x="655.3333333333334" y="78" width="294.7" height="206" rx="16" fill="#fff0e2" stroke="#b7d3e7"/><text x="802.7" y="112" text-anchor="middle" font-weight="bold" font-size="21" fill="#1d507a">ילד Aa</text><text x="802.7" y="151" text-anchor="middle" font-size="18" fill="#31526b">יכול להיות חולה</text><text x="802.7" y="181" text-anchor="middle" font-size="18" fill="#31526b">או בריא בגלל חדירות</text><text x="490" y="325" text-anchor="middle" font-size="16" fill="#436380">50% חדירות = בקרב נושאי A, בערך חצי מבטאים את המחלה</text></svg>