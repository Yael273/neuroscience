<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="בקרת פתרון — מונעים טעות אמיתית במבחן">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בקרת פתרון — מונעים טעות אמיתית במבחן</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >דוגמה קונקרטית לשאלה שבה מתבלבלים בין יחס בתוך מין ליחס כולל</text>
 <g class="scene" style="--delay:0.0s"><rect x="55" y="125" width="310" height="217" rx="14" fill="#e8f4ff" stroke="#c8d9e6" stroke-width="2" /><text x="210.0" y="167" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >שאלה לדוגמה</text><text x="210.0" y="208" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >כבש לבן ובעל קרניים</text><text x="210.0" y="243" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >מתוך כל הטלאים ב־F₂</text><text x="210.0" y="278" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בהנחה שמחצית זכרים</text></g><g class="scene" style="--delay:0.8s"><rect x="399" y="125" width="302" height="217" rx="14" fill="#eaf7f1" stroke="#c8d9e6" stroke-width="2" /><text x="550" y="170" font-size="23" fill="#247b5e" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בתוך הזכרים</text><text x="550" y="223" font-size="29" fill="#174e62" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >¾ × ¾ = 9/16</text><text x="550" y="286" font-size="18" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >לבן × בעל קרניים</text></g><g class="scene" style="--delay:1.6s"><rect x="735" y="125" width="313" height="217" rx="14" fill="#fff2e8" stroke="#c8d9e6" stroke-width="2" /><text x="892" y="173" font-size="23" fill="#925525" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >מתוך כלל הטלאים</text><text x="892" y="226" font-size="28" fill="#9c5721" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >½ × 9/16 = 9/32</text><text x="892" y="287" font-size="18" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >תשובה כוללת גם את המין</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >קודם מזהים מהו מרחב המדגם; רק אז כופלים הסתברויות.</text>
 </svg>