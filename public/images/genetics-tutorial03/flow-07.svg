<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="מחקר תאומים: משווים שיעור הסכמה בפועל">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >מחקר תאומים: משווים שיעור הסכמה בפועל</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >המספרים מהנתונים בתרגול; כל שיעור מחושב מתוך סוג התאומים שלו</text>
 <g class="scene" style="--delay:0.0s"><rect x="62" y="120" width="310" height="218" rx="14" fill="#e8f4ff" stroke="#c8d9e6" stroke-width="2" /><text x="217.0" y="162" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >תאומים זהים</text><text x="217.0" y="203" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >82 זוגות מסכימים</text><text x="217.0" y="238" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >16 זוגות אינם מסכימים</text><text x="217.0" y="273" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >82/98 ≈ 83.7%</text></g><g class="scene" style="--delay:0.8s"><rect x="412" y="120" width="310" height="218" rx="14" fill="#f3f0ff" stroke="#c8d9e6" stroke-width="2" /><text x="567.0" y="162" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >תאומים אחוותיים</text><text x="567.0" y="203" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >44 זוגות מסכימים</text><text x="567.0" y="238" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >22 זוגות אינם מסכימים</text><text x="567.0" y="273" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >44/66 ≈ 66.7%</text></g><g class="scene" style="--delay:1.6s"><rect x="760" y="125" width="283" height="208" rx="14" fill="#f1faf4" stroke="#c8d9e6" stroke-width="2" /><text x="903" y="167" font-size="25" fill="#226a55" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >ההשוואה</text><rect x="786" y="206" width="225" height="22" rx="6" fill="#e0e9f0" stroke="#c8d9e6" stroke-width="2" /><rect x="786" y="206" width="188" height="22" rx="6" fill="#2484bd" stroke="#2484bd" stroke-width="2" /><rect x="786" y="266" width="225" height="22" rx="6" fill="#e0e9f0" stroke="#c8d9e6" stroke-width="2" /><rect x="786" y="266" width="150" height="22" rx="6" fill="#8a78cb" stroke="#8a78cb" stroke-width="2" /><text x="900" y="321" font-size="19" fill="#28536d" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >זהים גבוהים יותר</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >פער בהסכמה עשוי לתמוך בתרומה גנטית, אך אינו מוכיח סיבתיות.</text>
 </svg>