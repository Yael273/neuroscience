<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="אותו גנוטיפ — פנוטיפים שונים">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אותו גנוטיפ — פנוטיפים שונים</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >דוגמת השרקנים: הסביבה משנה את ביטוי האלל הרצסיבי</text>
 <g class="scene" style="--delay:0.0s"><rect x="75" y="118" width="270" height="198" rx="14" fill="#e8f3ff" stroke="#c8d9e6" stroke-width="2" /><text x="210.0" y="160" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אותו גנוטיפ: aa</text><text x="210.0" y="201" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >האללים אינם משתנים</text><text x="210.0" y="236" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >כאשר הטמפרטורה משתנה</text></g><g class="scene" style="--delay:0.8s"><rect x="420" y="118" width="255" height="198" rx="14" fill="#fff" stroke="#c9dae8" stroke-width="2" /><text x="548" y="163" font-size="27" fill="#1f6ca5" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >18°C</text><ellipse cx="548" cy="235" rx="76" ry="46" fill="#fcfcff" stroke="#866b57" stroke-width="3"/><circle cx="595" cy="224" r="5" fill="#283d50" stroke="#283d50" stroke-width="1"/><text x="548" y="300" font-size="20" fill="#254663" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >פרווה לבנה</text></g><g class="scene" style="--delay:1.6s"><rect x="730" y="118" width="255" height="198" rx="14" fill="#fff" stroke="#c9dae8" stroke-width="2" /><text x="858" y="163" font-size="27" fill="#1f6ca5" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >25°C</text><ellipse cx="858" cy="235" rx="76" ry="46" fill="#c79468" stroke="#866b57" stroke-width="3"/><circle cx="905" cy="224" r="5" fill="#283d50" stroke="#283d50" stroke-width="1"/><text x="858" y="300" font-size="20" fill="#254663" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >פרווה חומה</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >ב־18°C הפרט aa לבן; ב־25°C אותו פרט aa חום. הגנוטיפ נשאר aa.</text>
 </svg>