<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 435" role="img" aria-label="איך מזהים נשא שלא מבטא מחלה?">
 <style>
 text{font-family:Arial,'Noto Sans Hebrew',sans-serif} .scene{opacity:0;animation:arrive .7s ease-out forwards;animation-delay:var(--delay)}
 @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
 @media (prefers-reduced-motion:reduce){.scene{animation:none;opacity:1}}
 </style>
 <rect x="3" y="3" width="1094" height="429" rx="21" fill="#f8fbff" stroke="#d5e5f2" stroke-width="2" />
 <text x="550" y="45" font-size="28" fill="#153b63" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >איך מזהים נשא שלא מבטא מחלה?</text>
 <text x="550" y="77" font-size="17" fill="#516f85" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >מחלה דומיננטית עם חדירות חלקית — מסיקים אללים לפי ההורשה</text>
 <g class="scene" style="--delay:0.0s"><rect x="50" y="118" width="265" height="210" rx="14" fill="#edf6ff" stroke="#c8d9e6" stroke-width="2" /><text x="182.5" y="160" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אם: aa</text><text x="182.5" y="201" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אין אלל A</text><text x="182.5" y="236" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אינה יכולה להעביר A</text><text x="365" y="240" font-size="39" fill="#5190b6" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >+</text></g><g class="scene" style="--delay:0.8s"><rect x="405" y="118" width="270" height="210" rx="14" fill="#eff9f4" stroke="#c8d9e6" stroke-width="2" /><text x="540.0" y="160" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אב: Aa</text><text x="540.0" y="201" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בריא למראה</text><text x="540.0" y="236" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >אך יכול להעביר A</text><line x1="540" y1="324" x2="540" y2="340" stroke="#8aaec4" stroke-width="3" /></g><g class="scene" style="--delay:1.6s"><rect x="785" y="118" width="270" height="210" rx="14" fill="#fff1eb" stroke="#c8d9e6" stroke-width="2" /><text x="920.0" y="160" font-size="23" fill="#184e78" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >ילד: Aa</text><text x="920.0" y="201" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >מבטא את המחלה</text><text x="920.0" y="236" font-size="21" fill="#17324f" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >את A קיבל מן האב</text><text x="728" y="240" font-size="38" fill="#5190b6" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >→</text></g>
 <text x="550" y="407" font-size="18" fill="#557187" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" >בריאותו של האב אינה שוללת Aa; חדירות של 50% היא הסתברות ביטוי, לא שינוי בהורשה.</text>
 </svg>