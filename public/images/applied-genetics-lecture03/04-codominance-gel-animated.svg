<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="ג׳ל מדומה עם גנוטיפים AA AB BB ושני פסים בהטרוזיגוט">
<style>
text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#20425e}
.head{font-size:27px;font-weight:700;fill:#17476d}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.mono{font-size:22px;font-weight:700;letter-spacing:1px}
.card{fill:#f4f8fc;stroke:#c8dced;stroke-width:2}
.blue{fill:#3d94c6}.green{fill:#36a480}.orange{fill:#e8a856}.red{fill:#de6e6e}
.pulse{animation:pulse 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 9s ease-in-out infinite}
.move{animation:mover 9s ease-in-out infinite}
.flow{stroke:#3193ad;stroke-width:3;stroke-dasharray:10 8;animation:dash 2s linear infinite}
@keyframes pulse{0%,12%,100%{opacity:.25;transform:scale(.98)}20%,80%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,15%,100%{opacity:.2}25%,80%{opacity:1}}
@keyframes mover{0%,12%{transform:translateX(-15px);opacity:.2}24%,85%{transform:translateX(0);opacity:1}100%{opacity:.2}}
@keyframes dash{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){.pulse,.blink,.move,.flow{animation:none}}
</style><rect x="0" y="0" width="960" height="470" rx="26" fill="#ffffff"/>
<text x="480" y="46" class="head" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">פענוח SSR קודומיננטי</text>
<rect x="170" y="90" width="620" height="285" rx="18" fill="#e9f0f7" stroke="#acc1d4" stroke-width="2"/><rect x="243" y="118" width="84" height="222" rx="8" fill="#c6d9e8"/><text x="285" y="405" class="label" text-anchor="middle">AA</text><rect x="251" y="190" width="68" height="12" rx="4" fill="#2a709f" class="pulse" style="animation-delay:0.76s"/><rect x="438" y="118" width="84" height="222" rx="8" fill="#c6d9e8"/><text x="480" y="405" class="label" text-anchor="middle">AB</text><rect x="446" y="190" width="68" height="12" rx="4" fill="#2a709f" class="pulse" style="animation-delay:1.16s"/><rect x="446" y="280" width="68" height="12" rx="4" fill="#2a709f" class="pulse" style="animation-delay:1.52s"/><rect x="633" y="118" width="84" height="222" rx="8" fill="#c6d9e8"/><text x="675" y="405" class="label" text-anchor="middle">BB</text><rect x="641" y="280" width="68" height="12" rx="4" fill="#2a709f" class="pulse" style="animation-delay:1.92s"/><text x="110" y="203" class="label" direction="rtl" unicode-bidi="plaintext">אלל A</text><text x="110" y="295" class="label" direction="rtl" unicode-bidi="plaintext">אלל B</text><text x="480" y="440" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">שני פסים בהטרוזיגוט → סמן קודומיננטי</text>
</svg>