<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="חישוב חזותי של תדירויות הטרוזיגוטים ומכפלתן">
<style>
text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#20425e}
.head{font-size:27px;font-weight:700;fill:#17476d}
.label{font-size:18px;font-weight:600}
.small{font-size:15px}
.mono{font-size:22px;font-weight:700;letter-spacing:1px}
.card{fill:#f4f8fc;stroke:#c8dced;stroke-width:2}
.blue{fill:#3d94c6}.green{fill:#36a480}.orange{fill:#e8a856}.red{fill:#de6e6e}
.pulse{animation:pulse 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 9s ease-in-out infinite}
.move{animation:mover 9s ease-in-out infinite}
.flow{stroke:#3193ad;stroke-width:3;stroke-dasharray:10 8;animation:dash 2s linear infinite}
@keyframes pulse{0%,12%,100%{opacity:.25;transform:scale(.98)}20%,80%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,15%,100%{opacity:.2}25%,80%{opacity:1}}
@keyframes mover{0%,12%{transform:translateX(-15px);opacity:.2}24%,85%{transform:translateX(0);opacity:1}100%{opacity:.2}}
@keyframes dash{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){.pulse,.blink,.move,.flow{animation:none}}
</style><rect x="0" y="0" width="960" height="470" rx="26" fill="#ffffff"/>
<text x="480" y="46" class="head" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">איך מחשבים התאמה אקראית בשלושה סמנים?</text>
<text x="480" y="91" class="small" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">דוגמה בהנחה שבכל לוקוס יש שני אללים ו-Hardy–Weinberg</text><rect x="64" y="126" width="265" height="207" rx="18" class="card"/><text x="196" y="166" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">סמן 1</text><text x="196" y="215" class="mono" text-anchor="middle">2×0.1×0.9</text><text x="196" y="269" class="mono" text-anchor="middle">= 0.18</text><rect x="88" y="299" width="81" height="11" rx="5" class="green pulse"/><rect x="366" y="126" width="265" height="207" rx="18" class="card"/><text x="498" y="166" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">סמן 2</text><text x="498" y="215" class="mono" text-anchor="middle">2×0.2×0.8</text><text x="498" y="269" class="mono" text-anchor="middle">= 0.32</text><rect x="390" y="299" width="144" height="11" rx="5" class="green pulse"/><rect x="668" y="126" width="265" height="207" rx="18" class="card"/><text x="800" y="166" class="label" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">סמן 3</text><text x="800" y="215" class="mono" text-anchor="middle">2×0.3×0.7</text><text x="800" y="269" class="mono" text-anchor="middle">= 0.42</text><rect x="692" y="299" width="189" height="11" rx="5" class="green pulse"/><path d="M 280 352 L 680 352" class="flow"/><text x="480" y="403" class="mono" text-anchor="middle">0.18 × 0.32 × 0.42 = 0.024192</text><text x="480" y="430" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">כ־2.42% התאמה אקראית בפרופיל הזה • רק תחת ההנחות המוצהרות</text>
</svg>