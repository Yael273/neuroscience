8 45 0 78 q 48 40 0 65" stroke="#e8a856" stroke-width="6" fill="none" class="pulse"/><text x="716" y="355" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">לולאה של חזרות בזמן השכפול</text>
