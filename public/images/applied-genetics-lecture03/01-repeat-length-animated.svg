" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:0.88s"/><rect x="445" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:1.10s"/><rect x="493" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:1.32s"/><rect x="541" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:1.54s"/><rect x="589" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:1.76s"/><rect x="637" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:1.98s"/><rect x="685" y="286" width="39" height="38" rx="4" fill="#55a891" opacity=".85" class="pulse" style="animation-delay:2.20s"/><text x="810" y="272" class="small">11 × 4 bp</text><text x="480" y="408" text-anchor="middle" class="small" direction="rtl" unicode-bidi="plaintext">מספר החזרות קובע את אורך האלל • שינוי במספר החזרות יוצר פולימורפיזם</text>
