<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="24" fill="#f8fbfa"/><text x="550" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" fill="#194f49" font-weight="bold">5 features of a good DNA marker</text><line x1="115" y1="137" x2="985" y2="137" stroke="#95ada8" stroke-width="7" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(125 0)"><circle cy="137" r="34" fill="#187d76"/><text y="148" fill="white" font-size="29" font-weight="bold">1</text><text y="209" font-size="23" fill="#18473f" font-weight="bold">Polymorphic</text><text y="239" font-size="18" fill="#416860">Multiple alleles</text><rect x="-72" y="273" width="144" height="40" rx="13" fill="#e8f3ee"/><text y="299" font-size="18" fill="#175b53">M1 / M2</text></g><g transform="translate(337 0)"><circle cy="137" r="34" fill="#187d76"/><text y="148" fill="white" font-size="29" font-weight="bold">2</text><text y="209" font-size="23" fill="#18473f" font-weight="bold">Codominant</text><text y="239" font-size="18" fill="#416860">Both alleles seen</text><rect x="-77" y="273" width="154" height="40" rx="13" fill="#e8f3ee"/><text y="299" font-size="18" fill="#175b53">M1 + M2</text></g><g transform="translate(550 0)"><circle cy="137" r="34" fill="#187d76"/><text y="148" fill="white" font-size="29" font-weight="bold">3</text><text y="209" font-size="23" fill="#18473f" font-weight="bold">Accessible</text><text y="239" font-size="17" fill="#416860">Age / tissue / sex</text><rect x="-65" y="273" width="130" height="40" rx="13" fill="#e8f3ee"/><text y="299" font-size="18" fill="#175b53">DNA</text></g><g transform="translate(763 0)"><circle cy="137" r="34" fill="#187d76"/><text y="148" fill="white" font-size="29" font-weight="bold">4</text><text y="209" font-size="22" fill="#18473f" font-weight="bold">Independent</text><text y="239" font-size="17" fill="#416860">Of gene expression</text><rect x="-71" y="273" width="142" height="40" rx="13" fill="#e8f3ee"/><text y="299" font-size="17" fill="#175b53">No protein</text></g><g transform="translate(977 0)"><circle cy="137" r="34" fill="#187d76"/><text y="148" fill="white" font-size="29" font-weight="bold">5</text><text y="209" font-size="22" fill="#18473f" font-weight="bold">Genome-wide</text><text y="239" font-size="17" fill="#416860">Well-spaced loci</text><rect x="-77" y="273" width="154" height="40" rx="13" fill="#e8f3ee"/><text y="299" font-size="17" fill="#175b53">Markers</text></g></g><rect x="65" y="367" width="970" height="78" rx="18" fill="#d9ece6"/><text x="550" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#174a43" font-weight="bold">Useful for tracing inheritance and mapping genes</text><text x="550" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#356c63">An ideal marker is informative, reliably measurable and well positioned</text></svg>