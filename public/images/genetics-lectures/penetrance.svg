<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" role="img" aria-label="Penetrance לעומת Expressivity"><style>text{font-family:Arial,sans-serif;fill:#224969}.t{font-size:27px;font-weight:bold}.s{font-size:20px}.n{font-size:17px}.b{fill:#f1f8fd;stroke:#a9cbe4;stroke-width:2}.step{animation:fade 6s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.4}35%,75%{opacity:1}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style><rect width="950" height="380" rx="22" fill="white"/><text x="475" y="47" class="t" text-anchor="middle">Penetrance לעומת Expressivity</text><rect x="40" y="90" width="420" height="226" rx="15" class="b"/><rect x="490" y="90" width="420" height="226" rx="15" class="b"/><text x="250" y="125" class="s" text-anchor="middle">חודרנות: האם מופיע?</text><text x="700" y="125" class="s" text-anchor="middle">התבטאות: עד כמה בולט?</text><circle cx="120" cy="210" r="32" fill="#59a6d5" class="step"/><circle cx="200" cy="210" r="32" fill="#59a6d5" class="step"/><circle cx="280" cy="210" r="32" fill="white" stroke="#86afcc" stroke-width="4"/><circle cx="360" cy="210" r="32" fill="white" stroke="#86afcc" stroke-width="4"/><circle cx="560" cy="210" r="12" fill="#59a6d5"/><circle cx="680" cy="210" r="24" fill="#59a6d5"/><circle cx="815" cy="210" r="40" fill="#59a6d5"/><text x="250" y="284" class="n" text-anchor="middle">דוגמה: 2 מתוך 4 מבטאים</text><text x="700" y="284" class="n" text-anchor="middle">ביטוי חלש / בינוני / חזק</text><text x="475" y="357" class="n" text-anchor="middle">המחשה לימודית, לא נתוני ניסוי</text></svg>