<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" role="img" aria-label="Norm of Reaction — תגובה שונה לתנאי סביבה"><style>text{font-family:Arial,sans-serif;fill:#224969}.t{font-size:27px;font-weight:bold}.s{font-size:20px}.n{font-size:17px}.b{fill:#f1f8fd;stroke:#a9cbe4;stroke-width:2}.step{animation:fade 6s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.4}35%,75%{opacity:1}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style><rect width="950" height="380" rx="22" fill="white"/><text x="475" y="47" class="t" text-anchor="middle">Norm of Reaction — תגובה שונה לתנאי סביבה</text><path d="M130 90 V310 H820" stroke="#2a7095" stroke-width="4" fill="none"/><path d="M150 280 Q480 240 795 120" stroke="#4c9dcd" stroke-width="6" fill="none" class="step"/><path d="M150 150 Q460 195 795 287" stroke="#ce9465" stroke-width="6" fill="none" class="step"/><text x="475" y="354" text-anchor="middle" class="s">תנאי סביבה</text><text x="83" y="90" class="s">פנוטיפ</text><text x="760" y="107" class="n">גנוטיפ A</text><text x="750" y="310" class="n">גנוטיפ B</text><text x="475" y="80" text-anchor="middle" class="n">גרף סכמטי — אינו מציג נתוני מדידה מהמצגת</text></svg>