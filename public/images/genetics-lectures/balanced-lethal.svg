<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" role="img" aria-label="Balanced Lethal — שני הומוזיגוטים אינם שורדים"><style>text{font-family:Arial,sans-serif;fill:#224969}.t{font-size:27px;font-weight:bold}.s{font-size:20px}.n{font-size:17px}.b{fill:#f1f8fd;stroke:#a9cbe4;stroke-width:2}.step{animation:fade 6s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.4}35%,75%{opacity:1}}@media(prefers-reduced-motion:reduce){.step{animation:none}}</style><rect width="950" height="380" rx="22" fill="white"/><text x="475" y="47" class="t" text-anchor="middle">Balanced Lethal — שני הומוזיגוטים אינם שורדים</text><rect x="40" y="100" width="270" height="220" rx="15" class="b"/><rect x="340" y="100" width="270" height="220" rx="15" class="b"/><rect x="640" y="100" width="270" height="220" rx="15" class="b"/><text x="175" y="157" class="s" text-anchor="middle">B+ / B+</text><text x="475" y="157" class="s" text-anchor="middle">B+ / +l</text><text x="775" y="157" class="s" text-anchor="middle">+l / +l</text><rect x="96" y="185" width="158" height="66" rx="10" fill="#e6aaaa" class="step"/><rect x="397" y="185" width="158" height="66" rx="10" fill="#a6dbb9"/><rect x="697" y="185" width="158" height="66" rx="10" fill="#e6aaaa" class="step"/><text x="175" y="227" class="s" text-anchor="middle">מת</text><text x="475" y="227" class="s" text-anchor="middle">שורד</text><text x="775" y="227" class="s" text-anchor="middle">מת</text><text x="175" y="288" class="n" text-anchor="middle">1/4</text><text x="475" y="288" class="n" text-anchor="middle">2/4</text><text x="775" y="288" class="n" text-anchor="middle">1/4</text><text x="475" y="354" class="n" text-anchor="middle">המודל מניח תאחיזה מלאה ללא שחלוף</text></svg>